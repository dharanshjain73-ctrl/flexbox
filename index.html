
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
            text-align: center;
            color: beige;
        }
.con{
    height: 600px;
    border: 1px solid black ;
    

}
.header{
    height: 20%;
    background-color: rgb(100, 100, 231);
     border: 1px solid black ;
     display: flex;
     align-items: center;
     justify-content: center;
}
.center{
    height: 60%;
    background-color: rgb(216, 95, 95);
    display:flex;
     border: 1px solid black ;

}
.left{
    height: 100%;
    width: 30%;
    background-color: rgb(151, 66, 36);
    border: 1px solid black ;
    display: flex;
    align-items: center;
    justify-content: center;
}
.right{
    heigh: 100%;
    width: 70%;
    background-color: rgb(14, 54, 92);
     border: 1px solid black ;
}
.top{
    height: 50%;
    background-color: rgb(54, 23, 104);
     border: 1px solid black ;
      display: flex;
     align-items: center;
     justify-content: center;
}
.bottom{
    height: 50%;
    background-color: rgb(16, 88, 88);
    display:flex;
     border: 1px solid black ;
}
.r1{
    height: 100%;
    width: 50%;
    background-color: rgb(81, 95, 16);
     border: 1px solid black ;
     display: flex;
     align-items: center;
     justify-content: center;
}
.r2{
    height: 100%;
    width: 50%;
    background-color: rgb(28, 117, 73);
     border: 1px solid black ;
      display: flex;
     align-items: center;
     justify-content: center;
}
.footer{
    height: 20%;
    background-color: rgb(163, 14, 44);
     border: 1px solid black ;  
      display: flex;
     align-items: center;
     justify-content: center;    
}
    </style>
</head>
<body>
    <h1 style="color: black;">FLEX BOX</h1>
    <div class="con">
         <div class="header">
            <h1 > Header</h1>
         </div>
         <div class="center">
            <div class="left"><h1>Left</h1></div>
            <div class="right">
                <div class="top"><h1>Top</h1></div>
                <div class="bottom">
                    <div class="r1"><h1>R1</h1></div>
                    <div class="r2"><h1>R2</h1></div>
                </div>
            </div>
         </div>
         <div class="footer"><h1>Footer</h1></div>
    </div>
</body>
</html>
